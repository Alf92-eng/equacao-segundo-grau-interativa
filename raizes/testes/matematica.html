<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Testes matemáticos de radiciação</title>
<h1>Testes matemáticos de radiciação</h1>
<ol id="resultados"></ol>
<p id="resumo"></p>
<script src="../script.js"></script>
<script>
  const { solve, MathDomainError } = window.RadicaisMath;
  const casos = [
    ["Raiz quadrada exata", { mode: "raiz", index: "2", a: "81" }, "9"],
    ["Simplifica raiz quadrada", { mode: "raiz", index: "2", a: "72" }, "6 · √(2)"],
    ["Raiz cúbica negativa", { mode: "raiz", index: "3", a: "-216" }, "−6"],
    ["Raiz de índice quatro", { mode: "raiz", index: "4", a: "256" }, "4"],
    ["Raiz irracional", { mode: "raiz", index: "2", a: "2" }, "√(2)"],
    ["Potência dentro da raiz", { mode: "potencia", index: "2", a: "2", power: "6" }, "8"],
    ["Potência ímpar de base negativa e índice ímpar", { mode: "potencia", index: "3", a: "-2", power: "3" }, "−2"],
    ["Multiplicação de radicais", { mode: "multiplicar", index: "2", a: "2", b: "8" }, "4"],
    ["Divisão de radicais", { mode: "dividir", index: "2", a: "48", b: "3" }, "4"],
    ["Divisão que deixa fração sob o radical", { mode: "dividir", index: "2", a: "2", b: "3" }, "1/3 · √(6)"],
    ["Potência de radical", { mode: "potencia-raiz", index: "2", a: "2", power: "3" }, "2 · √(2)"],
    ["Soma após simplificação", { mode: "somar", index: "2", a: "8", b: "18" }, "5 · √(2)"],
    ["Subtração de radicais semelhantes", { mode: "subtrair", index: "2", a: "18", b: "8" }, "√(2)"],
    ["Radicando zero", { mode: "raiz", index: "4", a: "0" }, "0"]
  ];
  let falhas = 0;
  for (const [nome, entrada, esperado] of casos) {
    let obtido;
    try { obtido = solve(entrada).exact; }
    catch (erro) { obtido = erro instanceof MathDomainError ? "erro de domínio" : "erro inesperado"; }
    const passou = obtido === esperado;
    if (!passou) falhas++;
    const item = document.createElement("li");
    item.textContent = `${passou ? "OK" : "FALHOU"} — ${nome}: ${obtido}`;
    document.querySelector("#resultados").append(item);
  }
  const invalidos = [
    ["Raiz par de negativo", { mode: "raiz", index: "2", a: "-9" }],
    ["Divisão por radicando zero", { mode: "dividir", index: "2", a: "9", b: "0" }],
    ["Índice fora do limite", { mode: "raiz", index: "1", a: "9" }],
    ["Potência negativa sob índice par", { mode: "potencia", index: "2", a: "-2", power: "3" }]
  ];
  for (const [nome, entrada] of invalidos) {
    let rejeitado = false;
    try { solve(entrada); }
    catch (erro) { rejeitado = erro instanceof MathDomainError; }
    if (!rejeitado) falhas++;
    const item = document.createElement("li");
    item.textContent = `${rejeitado ? "OK" : "FALHOU"} — ${nome}: ${rejeitado ? "entrada recusada" : "deveria ser inválida"}`;
    document.querySelector("#resultados").append(item);
  }
  const total = casos.length + invalidos.length;
  document.querySelector("#resumo").textContent = `${total - falhas}/${total} testes passaram`;
  document.body.dataset.falhas = String(falhas);
</script>
</html>
